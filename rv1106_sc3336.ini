; RV1106 + SC3336, based on the official 300W RKIPC profile.
; Change every 192.168.1.100 below to the wired-LAN address of the PC running MediaMTX.

[log]
level = 2 ; error=0, warn=1, info=2, debug=3

[stream]
enable_rtsp = 1
enable_rtmp = 1
rtsp_transport = tcp
io_timeout_ms = 5000
rtsp_main_url = rtsp://192.168.1.100:8554/main_rtsp
rtmp_main_url = rtmp://192.168.1.100:1935/main_rtmp
rtsp_ai_url = rtsp://192.168.1.100:8554/ai_rtsp
rtmp_ai_url = rtmp://192.168.1.100:1935/ai_rtmp

[audio.0]
enable = 1
card_name = hw:0,0
encode_type = G711A
format = S16
sample_rate = 8000
channels = 1
frame_size = 1152
bit_rate = 64000
input = mic_in
volume = 50
enable_aed = 0
enable_bcd = 0
enable_vqe = 1
vqe_cfg = /oem/usr/share/vqefiles/config_aivqe.json

[video.source]
enable_aiq = 1
enable_vo = 0
enable_npu = 1
npu_fps = 10

[video.0]
stream_type = mainStream
max_width = 1920
max_height = 1080
width = 1920
height = 1080
input_buffer_count = 2
buffer_count = 4
buffer_size = 1048576
enable_refer_buffer_share = 1
rc_mode = CBR
rc_quality = high
src_frame_rate_den = 1
src_frame_rate_num = 25
dst_frame_rate_den = 1
dst_frame_rate_num = 25
mid_rate = 2048
max_rate = 4096
min_rate = 0
output_data_type = H.264 ; H.264 or H.265; H.265 requires enable_rtmp=0 with FFmpeg 4.x
h264_profile = high
gop = 50
gop_mode = normalP

[video.1]
stream_type = subStream
max_width = 704
max_height = 576
width = 704
height = 576
input_buffer_count = 3
buffer_count = 4
buffer_size = 202752
enable_refer_buffer_share = 1
rc_mode = CBR
rc_quality = high
src_frame_rate_den = 1
src_frame_rate_num = 25
dst_frame_rate_den = 1
dst_frame_rate_num = 25
mid_rate = 256
max_rate = 512
min_rate = 0
output_data_type = H.264
h264_profile = high
gop = 50
gop_mode = normalP

; The reused official RockIVA wrapper reads its input geometry from video.2.
; No third VI channel is created: these values mirror VI channel 1 only.
[video.2]
width = 704
height = 576

[rockiva]
model_path = /usr/lib/

[event.regional_invasion]
enabled = 1
position_x = 0
position_y = 0
width = 704
height = 576
proportion = 1
sensitivity_level = 90
time_threshold = 1
rockiva_model_type = small

[osd.common]
normalized_screen_width = 704
normalized_screen_height = 576

[isp]
scenario = normal
init_form_ini = 1
normal_scene = day
custom1_scene = night
ircut_open_gpio = 36
ircut_close_gpio = 35

[isp.0.adjustment]
contrast = 50
brightness = 50
saturation = 50
sharpness = 50
fps = 25
hue = 50

[isp.0.exposure]
iris_type = auto
exposure_mode = auto
gain_mode = auto
auto_iris_level = 5
auto_exposure_enabled = 1
audo_gain_enabled = 1
exposure_time = 1/6
exposure_gain = 1

[isp.0.night_to_day]
night_to_day = day
night_to_day_filter_level = 5
night_to_day_filter_time = 5
dawn_time = 07:00:00
dusk_time = 18:00:00
ircut_filter_action = day
over_exposure_suppress = open
over_exposure_suppress_type = auto
fill_light_mode = IR
brightness_adjustment_mode = auto
light_brightness = 1
distance_level = 1

[isp.0.blc]
blc_region = close
blc_strength = 1
wdr = close
wdr_level = 0
hdr = close
hdr_level = 1
hlc = close
hlc_level = 0
dark_boost_level = 0
position_x = 0
position_y = 0
blc_region_width = 120
blc_region_high = 92

[isp.0.white_blance]
white_blance_style = autoWhiteBalance
white_blance_red = 50
white_blance_green = 50
white_blance_blue = 50

[isp.0.enhancement]
noise_reduce_mode = close
denoise_level = 50
spatial_denoise_level = 50
temporal_denoise_level = 50
dehaze = close
dehaze_level = 0
dis = close
gray_scale_mode = [0-255]
distortion_correction = close
ldch_level = 0

[isp.0.video_adjustment]
image_flip = close
scene_mode = indoor
power_line_frequency_mode = PAL(50HZ)
